# yaml
# file: 'docker-compose.yml'
version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://appuser:secret@db:5432/appdb"
      NODE_ENV: production
      PORT: "3000"
      MIGRATE_RETRIES: "12"
      MIGRATE_DELAY: "2"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # do not bind-mount the project; it reintroduces prisma.config.ts into the container
    volumes: []
